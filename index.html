<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바른시선한의원 - AI 초진인사 생성기</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', '맑은 고딕', sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
        .section { background: #fafafa; border: 1px solid #e1e8ed; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .section-title { font-weight: bold; margin-bottom: 10px; color: #34495e; font-size: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="password"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        textarea { resize: vertical; }
        .btn-group { display: flex; gap: 10px; }
        button { cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.2s; }
        .btn-primary { background-color: #27ae60; color: white; width: 100%; padding: 14px; font-size: 16px; }
        .btn-primary:hover { background-color: #219150; }
        .btn-secondary { background-color: #3498db; color: white; padding: 8px 15px; font-size: 13px; }
        .btn-secondary:hover { background-color: #2980b9; }
        .btn-copy { background-color: #e67e22; color: white; padding: 8px 15px; font-size: 13px; float: right; margin-top: 5px; }
        .btn-copy:hover { background-color: #d35400; }
        details { margin-top: 10px; font-size: 13px; color: #666; }
        details summary { cursor: pointer; font-weight: bold; color: #555; }
        .template-box { margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏥 바른시선한의원 AI 초진인사 생성기</h2>

    <!-- 1. 기본 설정 -->
    <div class="section">
        <div class="section-title">🔑 기본 설정 (자동 저장됨)</div>
        <label for="apiKey">Google Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키를 입력하세요">
        
        <details>
            <summary>📁 카테고리별 예시 문구 설정 (접기/펼치기)</summary>
            <div class="template-box">
                <label>자동차보험 예시문</label>
                <textarea id="tplCar" rows="3" placeholder="자동차보험 txt 내용을 붙여넣으세요"></textarea>
                
                <label>다이어트 예시문</label>
                <textarea id="tplDiet" rows="3" placeholder="다이어트 txt 내용을 붙여넣으세요"></textarea>
                
                <label>일반통증 예시문</label>
                <textarea id="tplPain" rows="3" placeholder="일반통증 txt 내용을 붙여넣으세요"></textarea>
            </div>
        </details>
        <button class="btn-secondary" onclick="saveSettings()" style="margin-top: 10px;">💾 설정 저장하기</button>
    </div>

    <!-- 2. 환자 정보 입력 -->
    <div class="section">
        <div class="section-title">📝 신규 환자 상담 작성</div>
        <label for="category">카테고리 선택</label>
        <select id="category">
            <option value="car">자동차보험</option>
            <option value="diet">다이어트</option>
            <option value="pain">일반통증</option>
        </select>

        <label for="memo">환자 상담 메모 (EMR 복사 붙여넣기)</label>
        <textarea id="memo" rows="6" placeholder="예: 김OO님, 30대 여성, 교통사고 후 목/허리 통증. 오늘 침치료 및 추나 진행. 초기 3주간 주 3회 치료 권유..."></textarea>
    </div>

    <!-- 3. 생성 버튼 -->
    <button class="btn-primary" id="btnGenerate" onclick="generateGreeting()">✨ 초진 인사말 생성하기</button>

    <!-- 4. 결과 출력 -->
    <div class="section" style="margin-top: 20px;">
        <div class="section-title">
            ✉️ 완성된 초진 인사말
            <button class="btn-copy" onclick="copyResult()">📋 클립보드 복사</button>
        </div>
        <textarea id="result" rows="10" readonly placeholder="생성된 문장이 이곳에 나타납니다."></textarea>
    </div>
</div>

<script>
    // 페이지 로드 시 저장된 설정 불러오기
    window.onload = function() {
        if(localStorage.getItem('gemini_api_key')) document.getElementById('apiKey').value = localStorage.getItem('gemini_api_key');
        if(localStorage.getItem('tpl_car')) document.getElementById('tplCar').value = localStorage.getItem('tpl_car');
        if(localStorage.getItem('tpl_diet')) document.getElementById('tplDiet').value = localStorage.getItem('tpl_diet');
        if(localStorage.getItem('tpl_pain')) document.getElementById('tplPain').value = localStorage.getItem('tpl_pain');
    };

    // 설정 저장 함수
    function saveSettings() {
        localStorage.setItem('gemini_api_key', document.getElementById('apiKey').value.trim());
        localStorage.setItem('tpl_car', document.getElementById('tplCar').value);
        localStorage.setItem('tpl_diet', document.getElementById('tplDiet').value);
        localStorage.setItem('tpl_pain', document.getElementById('tplPain').value);
        alert("API 키와 카테고리별 예시문이 브라우저에 안전하게 저장되었습니다!");
    }

    // AI 초진 인사 생성 함수
    async function generateGreeting() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const category = document.getElementById('category').value;
        const memo = document.getElementById('memo').value.trim();

        if (!apiKey) {
            alert("Google API Key를 입력 후 저장해 주세요.");
            return;
        }
        if (!memo) {
            alert("환자 상담 메모를 입력해 주세요.");
            return;
        }

        // 선택한 카테고리에 맞는 템플릿 가져오기
        let tplContent = "";
        let catName = "";
        if (category === 'car') { tplContent = document.getElementById('tplCar').value; catName = "자동차보험"; }
        else if (category === 'diet') { tplContent = document.getElementById('tplDiet').value; catName = "다이어트"; }
        else if (category === 'pain') { tplContent = document.getElementById('tplPain').value; catName = "일반통증"; }

        const btn = document.getElementById('btnGenerate');
        const resultArea = document.getElementById('result');

        btn.disabled = true;
        btn.innerText = "⏳ 초진 인사말 작성 중...";
        resultArea.value = "";

        const prompt = `
당신은 바른시선한의원의 김영효 원장입니다.
제공된 [기존 작성 글 예시]들의 어조, 문체, 친절함, 단어 선택, 문장 구조를 완벽하게 모방하여 [신규 환자 상담 메모]를 바탕으로 한 초진 인사 메시지를 작성해주세요.

[카테고리]: ${catName}

[기존 작성 글 예시]:
${tplContent}

[신규 환자 상담 메모]:
${memo}

[작성 규칙]:
1. 인사말은 항상 "안녕하세요, [환자이름]님 바른시선한의원 원장 김영효입니다." 또는 예시에 나온 원장님의 대표 인사 어조로 시작하세요.
2. 환자의 이름, 주요 증상, 원인, 오늘 진행한 치료(침, 약침, 추나, 한약 등), 향후 내원 권장 주기(예: 급성기 3주간 매일 또는 주 3회 등) 및 생활 지도 사항을 자연스럽게 포함하세요.
3. 기존 작성 예시들과 동일한 톤앤매너(따뜻함, 전문성, 공감)를 철저히 유지하세요.
4. 카카오톡이나 문자 메시지로 발송하기 적절하도록 깔끔하게 출력하세요.
`;

        try {
            // Gemini API 호출 (최신 v1beta REST API)
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (data.candidates && data.candidates[0].content.parts[0].text) {
                resultArea.value = data.candidates[0].content.parts[0].text;
            } else {
                alert("생성에 실패했습니다. API 키나 입력 데이터를 확인해주세요.");
            }
        } catch (error) {
            alert("오류가 발생했습니다: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ 초진 인사말 생성하기";
        }
    }

    // 클립보드 복사 함수
    function copyResult() {
        const resultArea = document.getElementById('result');
        if (!resultArea.value) {
            alert("복사할 내용이 없습니다.");
            return;
        }
        resultArea.select();
        document.execCommand('copy');
        alert("초진 인사말이 클립보드에 복사되었습니다!");
    }
</script>

</body>
</html>
