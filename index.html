<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>바른시선한의원 - AI 초진인사 생성기</title>
    <style>
        * { box-sizing: border-box; font-family: 'Pretendard', '맑은 고딕', sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
        
        /* 비밀번호 로그인 화면 스타일 */
        #loginOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 62, 80, 0.95); display: flex;
            justify-content: center; align-items: center; z-index: 9999;
        }
        .login-box {
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 380px;
        }
        .login-box h3 { margin-top: 0; color: #2c3e50; font-size: 20px; }
        .login-box input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; text-align: center; }
        .login-box button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-box button:hover { background-color: #219150; }

        /* 메인 콘텐츠 스타일 */
        .section { background: #fafafa; border: 1px solid #e1e8ed; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .section-title { font-weight: bold; margin-bottom: 10px; color: #34495e; font-size: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        input[type="password"], input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; margin-bottom: 10px; }
        textarea { resize: vertical; }
        .btn-primary { background-color: #27ae60; color: white; width: 100%; padding: 14px; font-size: 16px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-primary:hover { background-color: #219150; }
        .btn-copy { background-color: #e67e22; color: white; padding: 8px 15px; font-size: 13px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; float: right; margin-top: 5px; }
        .btn-copy:hover { background-color: #d35400; }
        details { margin-top: 10px; font-size: 13px; color: #666; }
        details summary { cursor: pointer; font-weight: bold; color: #555; }
        .template-box { margin-top: 10px; }
        .saved-badge { font-size: 11px; color: #27ae60; margin-left: 5px; display: none; }
    </style>
</head>
<body>

<!-- 🔒 접속 비밀번호 화면 -->
<div id="loginOverlay">
    <div class="login-box">
        <h3>🏥 바른시선한의원</h3>
        <p style="font-size: 13px; color: #666; margin-bottom: 10px;">접속을 위해 비밀번호를 입력하세요.</p>
        <input type="password" id="accessPassword" placeholder="비밀번호 입력" onkeypress="if(event.keyCode==13) checkPassword()">
        <button onclick="checkPassword()">로그인</button>
    </div>
</div>

<!-- 📱 메인 앱 화면 -->
<div class="container" id="mainApp" style="display: none;">
    <h2>🏥 바른시선한의원 AI 초진인사 생성기</h2>

    <!-- 1. 기본 설정 -->
    <div class="section">
        <div class="section-title">
            🔑 기본 설정 
            <span id="savedBadge" class="saved-badge">✓ API 키 자동 저장됨</span>
        </div>
        <label for="apiKey">Google Gemini API Key (입력시 자동 저장됩니다)</label>
        <input type="password" id="apiKey" placeholder="AI Studio에서 발급받은 API 키를 입력하세요" oninput="autoSaveApiKey()">
        
        <details>
            <summary>📁 카테고리별 예시 문구 설정 (접기/펼치기)</summary>
            <div class="template-box">
                <label>자동차보험 예시문 (전체 데이터)</label>
                <textarea id="tplCar" rows="5" oninput="autoSaveTemplates()"></textarea>
                
                <label>다이어트 예시문 (전체 데이터)</label>
                <textarea id="tplDiet" rows="5" oninput="autoSaveTemplates()"></textarea>
                
                <label>일반통증 예시문 (전체 데이터)</label>
                <textarea id="tplPain" rows="5" oninput="autoSaveTemplates()"></textarea>
            </div>
        </details>
    </div>

    <!-- 2. 환자 정보 입력 -->
    <div class="section">
        <div class="section-title">📝 신규 환자 상담 작성</div>
        <label for="category">카테고리 선택</label>
        <select id="category">
            <option value="car">자동차보험</option>
            <option value="diet">다이어트</option>
            <option value="pain">일반통증</option>
        </select>

        <label for="memo">환자 상담 메모 (EMR 복사 붙여넣기)</label>
        <textarea id="memo" rows="6" placeholder="예: 김OO님, 30대 여성, 교통사고 후 목/허리 통증. 오늘 침치료 및 추나 진행. 초기 3주간 주 3회 치료 권유..."></textarea>
    </div>

    <!-- 3. 생성 버튼 -->
    <button class="btn-primary" id="btnGenerate" onclick="generateGreeting()">✨ 초진 인사말 생성하기</button>

    <!-- 4. 결과 출력 -->
    <div class="section" style="margin-top: 20px;">
        <div class="section-title">
            ✉️ 완성된 초진 인사말
            <button class="btn-copy" onclick="copyResult()">📋 클립보드 복사</button>
        </div>
        <textarea id="result" rows="10" readonly placeholder="생성된 문장이 이곳에 나타납니다."></textarea>
    </div>
</div>

<script>
    // ==========================================
    // 🔑 1. 접속 비밀번호 설정
    // ==========================================
    const APP_PASSWORD = "818-1575-a";

    // ==========================================
    // 📄 2. 카테고리별 원본 전체 데이터
    // ==========================================
    const DEFAULT_TEMPLATES = {
        car: `[자동차보험통증 환자 초진 인사말 모음]

안녕하세요, 류신애님 바른시선한의원 원장 김영효입니다.

첫 내원 감사드립니다. 오늘은 교통사고로 인한 두통과 목 어깨통증, 요통으로 내원해주셨는데요, 급성기를 약간 지나긴 했지만 증상이 심한편이라 일이 바쁘시더라도 주3회 내원가능한 5월 21까지, 꼭 주3회 나오셔서 치료를 잘 받으시길 바랍니다. 

침치료와 약침치료 추나치료로 기혈 순환 개선 및 근육, 신경 이완에 집중할 것입니다. 앉아계신 시간이 많은 만큼 1시간정도 지나면 주기적으로 자리에서 일어나서 10분정도는 걸어야 근육과 관절의 피로를 줄일 수 있습니다. 

환자분의 건강한 회복을 위해 최선을 다해 진료하겠습니다.

==================================================

안녕하세요, 바른시선한의원 원장 김영효입니다.

저희 한의원에 내원해 주셔서 감사합니다. 교통사고 후 목, 어깨, 허리 통증으로 많이 불편하실 것으로 생각됩니다. 특히 좌회전 중 좌측 추돌 사고로 인해 목, 어깨 부위의 편타성 손상과 기존 허리 디스크 협착 부위의 악화 가능성에 대한 우려도 있습니다. 

교통사고 환자분들은 초기에 적극적인 치료가 중요하며, 저희 한의원에서는 침치료, 약침치료, 그리고 가장 효과적인 추나치료를 시행하여 통증을 완화하고 회복을 돕겠습니다. 초기 3주 동안은 퇴원이후에도 되도록 매일 내원하시어 집중적인 치료를 받으시는 것이 좋습니다. 이후 경과에 따라 치료 횟수를 조절해 드리겠습니다.
불편하신 증상이 빠르게 호전될 수 있도록 최선을 다해 치료하겠습니다. 믿고 따라와 주시면 분명 좋은 결과를 얻으실 수 있을 겁니다.`,

        diet: `[다이어트 환자 초진 인사말 모음]

안녕하세요. 다이어트 상담을 도와드린 김영효 원장입니다.

건강한 체중 감량을 위해 스트레스 감소, 간보호 및 체지방분해, 탈모 및 체력 보강에 도움이 되는 녹용 맞춤 처방이 포함된 프로그램을 안내드렸습니다.

앞으로 다이어트 앱을 통해 매일 체중과 식단을 기록해주시면 규칙적인 생활 습관을 만들어 가실 수 있습니다.
기록을 잘 해주시는 분들이 평균 10% 정도 더 체중감량이 되었습니다. 

다음 내원 시에는 이번 한 주간의 약반응을 살펴보고 상담 후 은희님에게 맞는 약을 처방해드리겠습니다.
궁금하시거나 걱정되는 부분은 카톡 채널로 연락주세요~ 저희도 잘 도와드리겠습니다.
한 주간 다이어트와 식단관리 잘해주시고 일주일 후에 뵙겠습니다. 🍀`,

        pain: `[일반통증 환자 초진 인사말 모음]

안녕하세요, 우일영님 바른시선한의원 원장 김영효입니다.

골프 연습 중 허리 통증이 발생하여 방문해 주셨는데요, 진료 결과, 골반 움직임이 제한되면서 허리 근육이 과도하게 사용되어 통증이 발생한 것으로 보입니다.

오늘은 허리 통증 완화를 위해 침, 약침, 추나치료를 시행하였습니다. 초기에는 통증 완화를 위해 주 3회 정도 꾸준히 내원하시는 것이 좋으나 부득이 여행때문에 오지 못하시니 즐거운 여행 후 남은 치료를 위해 다시 내원해주시길 바랍니다. 

오늘 밤 잘 때는 무릎아래 베개나 쿠션을 넣어서 무릎이 굽혀진 자세로 잠을 자거나, 옆으로 누워 다리 사이에 긴 바디필로우를 끼우고 주무시면 좀더 허리 통증 개선에 도움이 됩니다. 

불편한 허리 통증이 잘 치료되어 일상생활에서 불편함 없이 편안하게 지내실 수 있도록 최선을 다해 돕겠습니다.`
    };

    // 비밀번호 검증
    function checkPassword() {
        const inputPw = document.getElementById('accessPassword').value;
        if (inputPw === APP_PASSWORD) {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
            initSettings();
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            document.getElementById('accessPassword').value = '';
        }
    }

    // 설정 초기화 및 불러오기
    function initSettings() {
        const savedApiKey = localStorage.getItem('gemini_api_key');
        if (savedApiKey) {
            document.getElementById('apiKey').value = savedApiKey;
            document.getElementById('savedBadge').style.display = 'inline';
        }

        document.getElementById('tplCar').value = localStorage.getItem('tpl_car') || DEFAULT_TEMPLATES.car;
        document.getElementById('tplDiet').value = localStorage.getItem('tpl_diet') || DEFAULT_TEMPLATES.diet;
        document.getElementById('tplPain').value = localStorage.getItem('tpl_pain') || DEFAULT_TEMPLATES.pain;
    }

    // API 키 자동 저장
    function autoSaveApiKey() {
        const val = document.getElementById('apiKey').value.trim();
        localStorage.setItem('gemini_api_key', val);
        
        const badge = document.getElementById('savedBadge');
        if (val) {
            badge.style.display = 'inline';
        } else {
            badge.style.display = 'none';
        }
    }

    // 예시문 수정 시 자동 저장
    function autoSaveTemplates() {
        localStorage.setItem('tpl_car', document.getElementById('tplCar').value);
        localStorage.setItem('tpl_diet', document.getElementById('tplDiet').value);
        localStorage.setItem('tpl_pain', document.getElementById('tplPain').value);
    }

    // AI 초진 인사 생성
    async function generateGreeting() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const category = document.getElementById('category').value;
        const memo = document.getElementById('memo').value.trim();

        if (!apiKey) {
            alert("Google API Key를 입력해 주세요. (1회 입력 시 자동 저장됩니다)");
            return;
        }
        if (!memo) {
            alert("환자 상담 메모를 입력해 주세요.");
            return;
        }

        let tplContent = "";
        let catName = "";
        if (category === 'car') { tplContent = document.getElementById('tplCar').value; catName = "자동차보험"; }
        else if (category === 'diet') { tplContent = document.getElementById('tplDiet').value; catName = "다이어트"; }
        else if (category === 'pain') { tplContent = document.getElementById('tplPain').value; catName = "일반통증"; }

        const btn = document.getElementById('btnGenerate');
        const resultArea = document.getElementById('result');

        btn.disabled = true;
        btn.innerText = "⏳ 초진 인사말 작성 중...";
        resultArea.value = "";

        const prompt = `
당신은 바른시선한의원의 한의사 김영효입니다.
제공된 [기존 작성 글 예시]들의 어조, 문체, 친절함, 단어 선택, 문장 구조를 완벽하게 모방하여 [신규 환자 상담 메모]를 바탕으로 한 초진 인사 메시지를 작성해주세요.

[카테고리]: ${catName}

[기존 작성 글 예시]:
${tplContent}

[신규 환자 상담 메모]:
${memo}

[작성 규칙]:
1. 인사말은 항상 "안녕하세요, [환자이름]님 바른시선한의원 원장 김영효입니다." 또는 예시에 나온 원장님의 대표 인사 어조로 시작하세요.
2. 환자의 이름, 주요 증상, 원인, 오늘 진행한 치료(침, 약침, 추나, 한약 등), 향후 내원 권장 주기 및 생활 지도 사항을 자연스럽게 포함하세요.
3. 기존 작성 예시들과 동일한 톤앤매너(따뜻함, 전문성, 공감)를 철저히 유지하세요.
4. 카카오톡이나 문자 메시지로 발송하기 적절하도록 깔끔하게 출력하세요.
`;

       try {
            // gemini-2.0-flash 최신 모델로 엔드포인트 변경
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }] }]
                })
            });

            const data = await response.json();
            
            if (response.ok && data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                resultArea.value = data.candidates[0].content.parts[0].text;
            } else {
                const errorMsg = data.error ? data.error.message : "알 수 없는 오류가 발생했습니다.";
                alert(`생성 실패 (${response.status}): ${errorMsg}`);
            }
        } catch (error) {
            alert("통신 오류 발생: " + error.message);
        } finally {
            btn.disabled = false;
            btn.innerText = "✨ 초진 인사말 생성하기";
        }
    }

    // 복사 기능
    function copyResult() {
        const resultArea = document.getElementById('result');
        if (!resultArea.value) {
            alert("복사할 내용이 없습니다.");
            return;
        }
        resultArea.select();
        document.execCommand('copy');
        alert("초진 인사말이 클립보드에 복사되었습니다!");
    }
</script>

</body>
</html>
